name: Deploy

# Triggered after CI passes on main. SSHes into the droplet, pulls,
# rebuilds, waits for /api/health to go green, rolls back on failure.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Allow manual re-deploys (e.g. to redeploy HEAD without pushing)
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false  # never cancel a deploy mid-flight

jobs:
  deploy:
    name: deploy to droplet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy when CI succeeded (or when manually triggered)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout (for rollback ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit for rollback

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write key via env var (avoids shell-quoting issues with multi-line PEM)
          echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Validate key is well-formed (exit non-zero if not)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          # Pre-populate known_hosts; fall back to accept-new if keyscan fails
          ssh-keyscan -T 10 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "known_hosts entries: $(wc -l < ~/.ssh/known_hosts)"

      - name: Test SSH connectivity
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'echo "SSH OK: $(hostname)"'

      - name: Record pre-deploy commit (for rollback)
        id: pre
        run: |
          PRE_COMMIT=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd sales-agent-publisher && git rev-parse HEAD')
          echo "sha=$PRE_COMMIT" >> $GITHUB_OUTPUT
          echo "Pre-deploy HEAD: $PRE_COMMIT"

      - name: Deploy (app-only by default, full only when infra config changed)
        id: deploy
        run: |
          # Rebuild scope is decided ON the droplet by diffing the new HEAD
          # against the pre-deploy HEAD. If only application code changed,
          # rebuild ONLY the `app` service so the cloudflared tunnel keeps its
          # registered edge connections. Restarting cloudflared causes a 5–15
          # min global Cloudflare edge propagation window during which a
          # fraction of public requests get false-positive 503s. We avoid
          # paying that cost on every app-code deploy.
          # See docs/incidents/2026-05-tunnel-flap.md and
          # docs/runbooks/edge-vs-origin-health.md.
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash <<'REMOTE'
            set -e
            cd sales-agent-publisher
            PRE=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            POST=$(git rev-parse HEAD)
            if [ "$PRE" = "$POST" ]; then
              # Manual redeploy of the same SHA — assume the operator wants a
              # full refresh (e.g. they're forcing a rebuild on purpose).
              SCOPE="full"
              CHANGED="(no commits — manual redeploy)"
            else
              CHANGED=$(git diff --name-only "$PRE" "$POST" -- docker-compose.yml cloudflared.yml 2>/dev/null || true)
              if [ -n "$CHANGED" ]; then
                SCOPE="full"
              else
                SCOPE="app-only"
              fi
            fi
            echo "Deploy scope: $SCOPE  (infra files changed: ${CHANGED:-none})"
            if [ "$SCOPE" = "full" ]; then
              docker compose up -d --build
              printf 'tunnel_rebuilt=true\nscope=full\n' > /tmp/deploy-scope
            else
              # App-only path: tunnel and db are NOT touched.
              docker compose up -d --build app
              printf 'tunnel_rebuilt=false\nscope=app-only\n' > /tmp/deploy-scope
            fi
          REMOTE
          # Pull scope info back to the runner for downstream steps.
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cat /tmp/deploy-scope 2>/dev/null || printf 'tunnel_rebuilt=unknown\nscope=unknown\n'" \
            >> $GITHUB_OUTPUT

      - name: Wait for health
        id: health
        run: |
          # Probe localhost:3000 from inside the droplet (NOT the public URL)
          # to bypass the Cloudflare → tunnel → app path. The tunnel can hold
          # stale TCP cache to the previous app container for an unpredictable
          # window after a rebuild, returning 503s that look like an app-level
          # failure but are infrastructure. Localhost goes straight to the
          # rebuilt container via the host loopback binding in docker-compose.
          echo "Polling http://localhost:3000/api/health on droplet for up to 3 minutes..."
          # Give app 20s to run prisma push and start Next.js
          sleep 20
          for i in $(seq 1 40); do
            CODE=$(ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=8 \
              -o BatchMode=yes \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "curl -s -o /tmp/h.json -w '%{http_code}' http://localhost:3000/api/health --max-time 5 || echo '000'" \
              2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health OK after ${i} attempt(s)"
              ssh -i ~/.ssh/id_ed25519 \
                -o StrictHostKeyChecking=accept-new \
                -o BatchMode=yes \
                ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                "cat /tmp/h.json" 2>/dev/null || true
              echo ""
              echo "ok=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 5
          done
          echo "ok=false" >> $GITHUB_OUTPUT
          echo "::error::Health check never reached 200 within 3 minutes"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.pre.outputs.sha != ''
        run: |
          echo "::warning::Deploy failed — rolling back to ${{ steps.pre.outputs.sha }}"
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash <<REMOTE
            set -e
            cd sales-agent-publisher
            git reset --hard ${{ steps.pre.outputs.sha }}
            docker compose up -d --build
          REMOTE

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed: ${context.sha.slice(0,7)}`,
              body: [
                `**Commit:** ${context.sha}`,
                `**Run:** ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Pre-deploy HEAD:** ${{ steps.pre.outputs.sha }} (rolled back to this)`,
                `**Deploy scope:** ${{ steps.deploy.outputs.scope || 'unknown' }} (tunnel_rebuilt=${{ steps.deploy.outputs.tunnel_rebuilt || 'unknown' }})`,
                `**Health check:** ${{ steps.health.outputs.ok == 'true' && '200 OK' || 'never reached 200' }}`,
                ``,
                `See the linked run for full logs.`,
              ].join('\n'),
              labels: ['deploy-failure', 'prod'],
            })
