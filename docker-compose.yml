services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOTE: deliberately NOT publishing 5432 to the host. The `app` service
    # reaches `db` on Docker's internal network via `db:5432`. Publishing
    # would expose Postgres to the public internet if the host firewall is
    # ever misconfigured. If you need direct DB access, use
    # `docker compose exec db psql ...` or port-forward via SSH tunnel.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    # Bind to host's loopback only — lets deploy.yml health check curl
    # localhost:3000 from the droplet (bypassing Cloudflare/tunnel which can
    # return cached 503s during a rebuild). Public traffic still goes through
    # the tunnel via the docker-internal `app:3000` route, NOT this binding.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/sales_tracker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Cron checks `now.getHours() === 20` for the 8 PM auto-process. Default
      # container TZ is UTC, so 8 PM UTC = 1:30 AM IST — wrong. Set IST so the
      # check fires when sales reps expect it.
      TZ: Asia/Kolkata
    volumes:
      # Persist WhatsApp auth across container rebuilds so users don't have to
      # re-pair every deploy. disconnect()/loggedOut wipes still apply.
      - ./baileys_auth:/app/.baileys_auth
    depends_on:
      db:
        condition: service_healthy
    # --accept-data-loss is intentional: the Visit table added a nullable
    # `raw_text_hash` column with @@unique(executive_id, visit_date, raw_text_hash).
    # Existing rows have NULL hashes; Postgres treats NULLs as distinct, so the
    # constraint adds cleanly. Prisma warns anyway; we accept.
    command: >
      sh -c "npx prisma@6 db push --skip-generate --accept-data-loss && node server.js"

  tunnel:
    # Pin to a specific tag — `:latest` re-pulls on every rebuild and shipped
    # QUIC regressions in 2026.3.0 that caused 48h of intermittent 503s.
    # Bump deliberately, never automatically. See docs/incidents/2026-05-tunnel-flap.md.
    image: cloudflare/cloudflared:2026.2.0
    restart: unless-stopped
    # NOTE: --protocol http2 was attempted on 2026-05-06 to bypass QUIC flap
    # behavior, but Cloudflare edge silently 503'd ALL traffic to HTTP/2-mode
    # connectors despite clean cloudflared registration logs (4/4 connIndex
    # registered, zero error logs, zero traffic forwarded for 13+ min). Reverted
    # to QUIC default. Version pin alone (2026.2.0 vs flapping 2026.3.0) is the
    # primary fix. See docs/incidents/2026-05-tunnel-flap.md for details.
    command: tunnel --no-autoupdate --config /cloudflared.yml run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    volumes:
      - ./cloudflared.yml:/cloudflared.yml:ro
    depends_on:
      - app

  caddy:
    # Production reverse-proxy — replaces cloudflared as public ingress.
    # See docs/runbooks/edge-vs-origin-health.md and
    # docs/proposals/ingress-hardening.md.
    #
    # Binds host 80/443. TLS via Cloudflare Origin Certificate at
    # /etc/caddy/origin-{cert,key}.pem on the droplet (mounted read-only).
    # Cloudflare's "Full (strict)" SSL mode validates this cert at the edge.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/caddy/origin-cert.pem:/etc/caddy/origin-cert.pem:ro
      - /etc/caddy/origin-key.pem:/etc/caddy/origin-key.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    healthcheck:
      # Probes the reverse-proxy locally (skip cert check; we just want to
      # confirm Caddy → app round-trip succeeds). The actual TLS validation
      # happens at Cloudflare's edge against the CF Origin Cert.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --no-check-certificate https://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
